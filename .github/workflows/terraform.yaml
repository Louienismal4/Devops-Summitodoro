name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yaml"]
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply the development environment"
        required: true
        type: choice
        options: [plan, apply]
        default: plan
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  id-token: write
  issues: write

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENVIRONMENT: development
  TF_STATE_BUCKET: summitodoro-656032436311-tfstate

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::656032436311:role/summitodoro-shared-github-plan
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments/development init -backend=false
      - run: terraform -chdir=infra/environments/development validate
      - run: terraform -chdir=infra/environments/development plan -out=tfplan

  deployment-plan:
    name: Development plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: development
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - id: commit
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::656032436311:role/summitodoro-development-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=infra/environments/development init -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_ENVIRONMENT}/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra/environments/development plan -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: development-tfplan-${{ github.run_id }}
          path: infra/environments/development/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply reviewed development plan
    needs: deployment-plan
    if: github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.deployment-plan.outputs.commit_sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::656032436311:role/summitodoro-development-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v5
        with:
          name: development-tfplan-${{ github.run_id }}
          path: infra/environments/development
      - run: test "${GITHUB_SHA}" = "${{ needs.deployment-plan.outputs.commit_sha }}"
      - run: terraform -chdir=infra/environments/development init -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_ENVIRONMENT}/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra/environments/development apply tfplan

  drift:
    name: Weekly development drift check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      detected: ${{ steps.plan.outputs.detected }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::656032436311:role/summitodoro-shared-github-plan
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=infra/environments/development init -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_ENVIRONMENT}/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - id: plan
        run: |
          set +e
          terraform -chdir=infra/environments/development plan -detailed-exitcode -lock=false -out=tfplan
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then echo "detected=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "detected=false" >> "$GITHUB_OUTPUT"

  report-drift:
    name: Report detected drift
    needs: drift
    if: needs.drift.outputs.detected == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Terraform drift detected: development" --body "Weekly Terraform drift detection found unexpected differences. Review the scheduled Terraform workflow and reconcile through a reviewed plan."

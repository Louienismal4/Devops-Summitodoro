name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

# Cancel an older run when newer commits are pushed to the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI is read-only by default.
permissions:
  contents: read
  security-events: write

env:
  CI: true
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # This succeeds even when the project does not generate coverage yet.
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.run_id }}
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # These must contain browser-safe build configuration only.
    # Do not place a Supabase service-role key here.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: >-
            ${{ runner.os }}-nextjs-
            ${{ hashFiles('package-lock.json') }}-
            ${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'app/**/*.[jt]s', 'app/**/*.[jt]sx', 'pages/**/*.[jt]s', 'pages/**/*.[jt]sx', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build production application
        run: npm run build

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Current policy: block high and critical production dependency findings.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scanning:
    needs: [quality, unit-tests, production-build, dependency-security]
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # CodeQL must upload its analysis to GitHub code scanning.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  ci-success:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality
      - unit-tests
      - production-build
      - dependency-security
      - secret-scanning
      - codeql

    steps:
      - name: Verify required jobs succeeded
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.production-build.result }}" = "success"
          test "${{ needs.dependency-security.result }}" = "success"
          test "${{ needs.secret-scanning.result }}" = "success"
          test "${{ needs.codeql.result }}" = "success"
